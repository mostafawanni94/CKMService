name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DEBUG: 'True'          # keeps the settings guards satisfied in CI
      SECRET_KEY: ci-only-not-a-real-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System check
        run: python manage.py check --fail-level WARNING

      - name: Fail if models and migrations disagree
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      - name: API client invariants
        run: npm run check:api
      - name: Type check
        run: npx tsc --noEmit
      # Non-blocking for now: the tree carries 211 pre-existing lint errors,
      # mostly `any` types and React 19's new set-state-in-effect rule. Keep the
      # signal visible and drive the count down, then flip this to blocking.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  mobile:
    name: Flutter apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Directory names are inverted relative to what the apps are:
        # FlutterProTotaalService is the employee app, FlutterEmployeeProject is
        # the customer portal.
        app: [FlutterProTotaalService, FlutterEmployeeProject]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

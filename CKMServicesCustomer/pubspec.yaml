name: ckm_services_customer
description: CKM Services Customer Portal - projects, work progress & photos

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Network & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  
  # Date & Time
  intl: ^0.20.2
  
  # Navigation
  go_router: ^14.6.2
  
  # Image viewing
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  
  # Pull to refresh
  pull_to_refresh: ^2.0.0
  
  # Shimmer loading
  shimmer: ^3.0.0
  
  # Utilities
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  
  # File export & sharing
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
